<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login ❤️</title>

<style>
body{
  margin:0;
  height:100vh;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#ff5f6d,#ffc371);
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

/* card */
.login-box{
  width:90%;
  max-width:420px;
  padding:34px 28px;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(14px);
  border-radius:28px;
  box-shadow:0 25px 50px rgba(0,0,0,0.35);
  text-align:center;
  animation:pop .8s ease;
}

@keyframes pop{
  from{transform:scale(.7);opacity:0}
  to{transform:scale(1);opacity:1}
}

h2{
  margin:0;
  font-size:1.9rem;
}

.subtitle{
  margin-top:6px;
  font-size:.95rem;
  opacity:.9;
}

/* inputs */
.input-box{
  margin-top:22px;
}

input{
  width:100%;
  padding:15px;
  margin:12px 0;
  border:none;
  border-radius:22px;
  font-size:1rem;
  outline:none;
  background:rgba(255,255,255,0.9);
  box-sizing:border-box; /* ✅ FIX */
}

input:focus{
  box-shadow:0 0 0 3px rgba(255,95,109,0.35);
}

/* button */
button{
  margin-top:18px;
  padding:15px;
  width:100%;
  border:none;
  border-radius:35px;
  background:white;
  color:#ff5f6d;
  font-size:1.1rem;
  cursor:pointer;
  box-shadow:0 10px 22px rgba(0,0,0,0.25);
  transition:transform .2s, box-shadow .2s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 14px 28px rgba(0,0,0,0.35);
}

/* error */
.error{
  margin-top:14px;
  color:#fff1f1;
  font-size:.95rem;
  display:none;
}

/* shake animation */
.shake{
  animation:shake .35s;
}
@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  50%{transform:translateX(6px)}
  75%{transform:translateX(-6px)}
  100%{transform:translateX(0)}
}
</style>
</head>

<body>

<div class="login-box" id="loginBox">

  <h2>Welcome Back ❤️</h2>
  <div class="subtitle">Login to unlock your surprise 🎁</div>

  <div class="input-box">
    <input type="tel" id="phone" placeholder="📞 Phone number">
    <input type="password" id="password" placeholder="🔐 Password">
  </div>

  <button onclick="login()">Login 🔓</button>

  <div class="error" id="errorMsg">Invalid phone number or password ❌</div>

</div>

<script>
/* default credentials */
const DEFAULT_PHONE = "8247767863";
const DEFAULT_PASSWORD = "1528";

function login(){
  const phone = document.getElementById("phone").value.trim();
  const pass = document.getElementById("password").value.trim();
  const error = document.getElementById("errorMsg");
  const box = document.getElementById("loginBox");

  if(phone === DEFAULT_PHONE && pass === DEFAULT_PASSWORD){
    window.location.href = "lock.html";
  }else{
    error.style.display = "block";
    box.classList.add("shake");
    setTimeout(()=>box.classList.remove("shake"),400);
  }
}
</script>

</body>
</html>
