<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love ❤️</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#ff5f6d,#ffc371);
  color:white;
  text-align:center;
  overflow:hidden;
}
.hidden{display:none}

/* ---------- RIBBON ---------- */
#ribbonScreen{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#ff5f6d,#ff9a9e);
  z-index:3000;
}
.ribbon-wrapper{
  position:absolute;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  cursor:pointer;
}
.ribbon-left,.ribbon-right{
  width:180px;
  height:45px;
  background:crimson;
}
.ribbon-left{border-radius:25px 0 0 25px}
.ribbon-right{border-radius:0 25px 25px 0}
.open .ribbon-left{animation:openLeft 1.2s forwards}
.open .ribbon-right{animation:openRight 1.2s forwards}
@keyframes openLeft{
  to{transform:translateX(-220px) rotate(-8deg);opacity:0}
}
@keyframes openRight{
  to{transform:translateX(220px) rotate(8deg);opacity:0}
}
.ribbon-text{
  position:absolute;
  width:100%;
  top:-35px;
  font-size:1.2rem;
}
/* .knot{
  position:absolute;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  width:60px;
  height:60px;
  background:gold;
  border-radius:50%;
} */

/* ---------- MAIN ---------- */
.container{padding:20px}
h1{font-size:2.2rem}
#typing{min-height:40px;margin:10px auto 25px}

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:25px;
  max-width:420px;
  margin:auto;
}
.piece{
  background:rgba(255,255,255,.18);
  border-radius:18px;
  padding:10px;
}
.piece img{
  width:100%;
  height:170px;
  object-fit:cover;
  border-radius:14px;
  cursor:pointer;
}

/* ---------- POPUP ---------- */
#popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:2000;
}
.popup-box{position:relative;max-width:90vw}
.popup-box img{
  width:100%;
  max-height:70vh;
  object-fit:contain;
  border-radius:20px;
}
.close-btn{
  position:absolute;
  top:-10px;
  right:-10px;
  width:36px;
  height:36px;
  border-radius:50%;
  border:none;
  background:white;
  color:#ff5f6d;
  font-size:18px;
  cursor:pointer;
}
.overlay{margin-top:15px}
.overlay button{
  padding:10px 20px;
  border-radius:25px;
  border:none;
  background:white;
  color:#ff5f6d;
  cursor:pointer;
}

/* ---------- BLAST ---------- */
.blast-text{
  display:none;
  margin-top:15px;
  font-size:1.5rem;
}
.blast{
  display:block;
  animation:blast .8s ease forwards;
}
@keyframes blast{
  0%{transform:scale(.3);opacity:0}
  60%{transform:scale(1.4);opacity:1}
  100%{transform:scale(1)}
}

@media(max-width:600px){
  .gallery{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- RIBBON -->
<div id="ribbonScreen">
  <div class="ribbon-wrapper" id="ribbon">
    <div class="ribbon-left"></div>
    <div class="ribbon-right"></div>
    <div class="ribbon-text">Tap to Open 🎀</div>
  </div>
  <div class="knot"></div>
</div>

<!-- MUSIC -->
<audio id="bgMusic" autoplay loop muted>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<!-- MAIN -->
<div id="mainContent" class="hidden">
  <div class="container">
    <h1>Happy Birthday My Love 🎂❤️</h1>
    <div id="typing"></div>

    <div class="gallery">
      <div class="piece"><img src="1.jpg" data-msg="You are my favorite part ❤️" data-surprise="I LOVE YOU 💖"></div>
      <div class="piece"><img src="2.jpg" data-msg="You make life beautiful ✨" data-surprise="YOU ARE MY WORLD 🌍"></div>
      <div class="piece"><img src="3.jpg" data-msg="Every moment is special 💕" data-surprise="FOREVER US 😍"></div>
      <div class="piece"><img src="4.jpg" data-msg="You complete me 🧩" data-surprise="HAPPY BIRTHDAY 🎂"></div>
    </div>
  </div>
</div>

<!-- POPUP -->
<div id="popup">
  <div class="popup-box">
    <button class="close-btn" type="button" onclick="closePopup()">✖</button>
    <img id="popupImg">
    <div class="overlay">
      <p id="popupMsg"></p>
      <button type="button" onclick="showSurprise()">Open Message 💥</button>
      <div class="blast-text" id="surpriseText"></div>
    </div>
  </div>
</div>

<script>
/* Ribbon */
const ribbon=document.getElementById("ribbon");
const ribbonScreen=document.getElementById("ribbonScreen");
const mainContent=document.getElementById("mainContent");
const music=document.getElementById("bgMusic");
music.volume=.5;

ribbon.onclick=()=>{
  ribbon.classList.add("open");
  music.muted=false;
  music.play().catch(()=>{});
  setTimeout(()=>{
    ribbonScreen.style.display="none";
    mainContent.classList.remove("hidden");
    document.body.style.overflow="auto";
  },1200);
};

/* Typing */
const text="Every piece of my life fits perfectly because of you ❤️";
let i=0;
(function type(){
  if(i<text.length){
    typing.innerHTML+=text.charAt(i++);
    setTimeout(type,80);
  }
})();

/* Popup */
let currentSurprise="";
document.querySelectorAll(".piece img").forEach(img=>{
  img.onclick=()=>{
    popupImg.src=img.src;
    popupMsg.textContent=img.dataset.msg;
    currentSurprise=img.dataset.surprise;
    surpriseText.style.display="none";
    popup.style.display="flex";
  };
});

/* ✅ FIXED SURPRISE */
function showSurprise(){
  surpriseText.textContent=currentSurprise;
  surpriseText.style.display="block";
  surpriseText.classList.remove("blast");
  void surpriseText.offsetWidth;
  surpriseText.classList.add("blast");
}

function closePopup(){
  popup.style.display="none";
}
</script>

</body>
</html>
